.deploy_template:
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y openssh-client sudo gettext-base curl
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - envsubst < .env.template > .env.$ENV_SUFFIX
    - export CONTAINER_NAME=$CONTAINER_NAME_VAR
    - export MOUNTED_VOLUME=$MOUNTED_VOLUME_VAR
    - envsubst < docker-compose.template.yml > docker-compose.new.yml
    - ssh $SSH_USER@$SSH_HOST "mkdir -p $WORK_DIR_VAR"
    - scp docker-compose.new.yml $SSH_USER@$SSH_HOST:$WORK_DIR_VAR/
    - scp .env.$ENV_SUFFIX $SSH_USER@$SSH_HOST:$WORK_DIR_VAR/.env
    - |
        ssh $SSH_USER@$SSH_HOST "echo $REGISTRY_TOKEN | sudo docker login --username $REGISTRY_USER_LOGIN \
        --password-stdin && cd $WORK_DIR_VAR && sudo docker compose -f docker-compose.new.yml pull && \
        sudo docker compose -f docker-compose.new.yml up --force-recreate -d && exit"

  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        curl -s -X POST "https://api.telegram.org/bot${CI_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CI_GROUP_ID}" \
          -d "message_thread_id=${CI_GROUP_TOPIC_ID}" \
          -d "parse_mode=HTML" \
          -d "text=<b>✅ Deploy $ENV_NAME</b>%0A<b>Project:</b> $CI_PROJECT_NAME%0A<b>Container:</b> <code>$CONTAINER_NAME_VAR</code>%0A<b>Status:</b> Started%0A<b>Pipeline:</b> $CI_PIPELINE_URL" || true
      else
        curl -s -X POST "https://api.telegram.org/bot${CI_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CI_GROUP_ID}" \
          -d "message_thread_id=${CI_GROUP_TOPIC_ID}" \
          -d "parse_mode=HTML" \
          -d "text=<b>❌ Deploy $ENV_NAME</b>%0A<b>Project:</b> $CI_PROJECT_NAME%0A<b>Container:</b> <code>$CONTAINER_NAME_VAR</code>%0A<b>Status:</b> FAILED%0A<b>Error:</b> Deploy or docker compose failed%0A<b>Pipeline:</b> $CI_PIPELINE_URL" || true
      fi

  tags:
    - docker
  allow_failure: false

deploy_ift:
  extends: .deploy_template
  stage: deploy_ift
  needs: ["build"]
  when: on_success

deploy_prom:
  extends: .deploy_template
  stage: deploy_prom
  needs: ["build", "deploy_ift", "healthcheck_ift"]
  when: manual