.shutdown_template:
  image: ubuntu:22.04
  when: manual
  before_script:
    - apt-get update && apt-get install -y openssh-client sudo curl
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $SSH_USER@$SSH_HOST "cd $WORK_DIR_VAR && sudo docker compose down && exit"

  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        curl -s -X POST "https://api.telegram.org/bot${CI_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CI_GROUP_ID}" \
          -d "message_thread_id=${CI_GROUP_TOPIC_ID}" \
          -d "parse_mode=HTML" \
          -d "text=<b>✅ Shutdown $ENV_NAME</b>%0A<b>Project:</b> $CI_PROJECT_NAME%0A<b>Container:</b> <code>$CONTAINER_NAME_VAR</code>%0A<b>Status:</b> Stopped%0A<b>Pipeline:</b> $CI_PIPELINE_URL" || true
      else
        curl -s -X POST "https://api.telegram.org/bot${CI_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CI_GROUP_ID}" \
          -d "message_thread_id=${CI_GROUP_TOPIC_ID}" \
          -d "parse_mode=HTML" \
          -d "text=<b>❌ Shutdown $ENV_NAME</b>%0A<b>Project:</b> $CI_PROJECT_NAME%0A<b>Container:</b> <code>$CONTAINER_NAME_VAR</code>%0A<b>Status:</b> FAILED%0A<b>Pipeline:</b> $CI_PIPELINE_URL" || true
      fi

  tags:
    - docker

shutdown_ift:
  extends: .shutdown_template
  stage: deploy_ift
  variables:
    ENV_NAME: "IFT"
    CONTAINER_NAME_VAR: $CONTAINER_NAME_IFT
    WORK_DIR_VAR: $WORK_DIR_IFT

shutdown_prom:
  extends: .shutdown_template
  stage: deploy_prom
  variables:
    ENV_NAME: "PROM"
    CONTAINER_NAME_VAR: $CONTAINER_NAME
    WORK_DIR_VAR: $WORK_DIR