.healthcheck_template:
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y openssh-client sudo curl
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SSH_USER@$SSH_HOST << DEPLOY_SCRIPT
      set -e
      cd $WORK_DIR_VAR
      
      CONTAINER_NAME=$CONTAINER_NAME_VAR
      HEALTH_CHECK_TIMEOUT=60
      CHECK_INTERVAL=5
      MAX_RESTARTS=5
      ELAPSED=0
      RESTART_COUNT=0
      LAST_RESTART_TIME=0
      
      echo "Starting healthcheck for container: \$CONTAINER_NAME"
      
      while [ \$ELAPSED -lt \$HEALTH_CHECK_TIMEOUT ]; do
        if ! sudo docker ps -a --format '{{.Names}}' | grep -q "^\${CONTAINER_NAME}\$"; then
          echo "ERROR: Container \$CONTAINER_NAME not found"
          exit 1
        fi
        
        CURRENT_RESTARTS=\$(sudo docker inspect \$CONTAINER_NAME --format='{{.RestartCount}}' 2>/dev/null || echo "0")
        CONTAINER_STATUS=\$(sudo docker inspect \$CONTAINER_NAME --format='{{.State.Status}}' 2>/dev/null)
        
        if [ "\$CONTAINER_STATUS" != "running" ]; then
          echo "ERROR: Container is not running. Status: \$CONTAINER_STATUS. Restart count: \$CURRENT_RESTARTS"
          if [ "\$CURRENT_RESTARTS" -ge "\$MAX_RESTARTS" ]; then
            echo "CRITICAL: Container restarted \$CURRENT_RESTARTS times. Rolling back..."
            sudo rm -f docker-compose.old.yml
            sudo mv docker-compose.new.yml docker-compose.crashed-\$(date +%Y%m%d-%H_%M_%S).yml
            sudo docker compose -f docker-compose.yml up -d
            exit 1
          fi
          exit 1
        fi
        
        if [ "\$CURRENT_RESTARTS" -gt "\$RESTART_COUNT" ]; then
          RESTART_COUNT=\$CURRENT_RESTARTS
          LAST_RESTART_TIME=\$ELAPSED
          echo "WARNING: Container restarted. Total restarts: \$RESTART_COUNT at \$ELAPSED seconds"
        fi
        
        echo "[\$ELAPSED/\$HEALTH_CHECK_TIMEOUT] Container running. Status: \$CONTAINER_STATUS. Restarts: \$CURRENT_RESTARTS"
        
        sleep \$CHECK_INTERVAL
        ELAPSED=\$((ELAPSED + CHECK_INTERVAL))
      done
      
      if [ "\$RESTART_COUNT" -lt "\$MAX_RESTARTS" ]; then
        echo "SUCCESS: Container is stable for \${HEALTH_CHECK_TIMEOUT}s with \$RESTART_COUNT restarts"
        sudo rm -f docker-compose.old.yml
        [ -f docker-compose.yml ] && sudo mv docker-compose.yml docker-compose.old.yml
        sudo mv docker-compose.new.yml docker-compose.yml
        echo "Config rotated: docker-compose.new.yml -> docker-compose.yml"
      else
        echo "ROLLBACK: Too many restarts detected"
        sudo mv docker-compose.new.yml docker-compose.crashed-\$(date +%Y%m%d-%H_%M_%S).yml
        sudo docker compose -f docker-compose.yml up -d
        exit 1
      fi
      DEPLOY_SCRIPT

  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        curl -s -X POST "https://api.telegram.org/bot${CI_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CI_GROUP_ID}" \
          -d "message_thread_id=${CI_GROUP_TOPIC_ID}" \
          -d "parse_mode=HTML" \
          -d "text=<b>✅ Healthcheck $ENV_NAME</b>%0A<b>Project:</b> $CI_PROJECT_NAME%0A<b>Container:</b> <code>$CONTAINER_NAME_VAR</code>%0A<b>Status:</b> STABLE (60s without restarts)%0A<b>Action:</b> Promoted docker-compose.new.yml → docker-compose.yml%0A<b>Pipeline:</b> $CI_PIPELINE_URL" || true
      else
        curl -s -X POST "https://api.telegram.org/bot${CI_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${CI_GROUP_ID}" \
          -d "message_thread_id=${CI_GROUP_TOPIC_ID}" \
          -d "parse_mode=HTML" \
          -d "text=<b>⚠️ Healthcheck $ENV_NAME</b>%0A<b>Project:</b> $CI_PROJECT_NAME%0A<b>Container:</b> <code>$CONTAINER_NAME_VAR</code>%0A<b>Status:</b> UNSTABLE (too many restarts)%0A<b>Action:</b> Rolled back to previous version%0A<b>Crashed config:</b> docker-compose.crashed-*.yml%0A<b>Pipeline:</b> $CI_PIPELINE_URL" || true
      fi

  tags:
    - docker
  allow_failure: false

healthcheck_ift:
  extends: .healthcheck_template
  stage: deploy_ift
  needs: ["deploy_ift"]
  when: on_success
  variables:
    ENV_NAME: "IFT"
    CONTAINER_NAME_VAR: $CONTAINER_NAME_IFT
    WORK_DIR_VAR: $WORK_DIR_IFT

healthcheck_prom:
  extends: .healthcheck_template
  stage: deploy_prom
  needs: ["deploy_prom"]
  when: on_success
  variables:
    ENV_NAME: "PROM"
    CONTAINER_NAME_VAR: $CONTAINER_NAME
    WORK_DIR_VAR: $WORK_DIR